project:
  output_dir: outputs
review:
  rubric_profile: ICLR
bench:
  root: /home/ubuntu/DeepReview-Bench
  output_dir: outputs/deepreview_bench
  splits:
    dev: /home/ubuntu/DeepReview-Bench/splits/deepreview13k_test_dev_clean100.jsonl
    lite: /home/ubuntu/DeepReview-Bench/splits/deepreview13k_test_lite.jsonl
    test: /home/ubuntu/DeepReview-Bench/splits/deepreview13k_test.jsonl
    all: /home/ubuntu/DeepReview-Bench/splits/all.jsonl
    merged_complete86: /home/ubuntu/paper-review-agent/outputs/deepreview_bench/runs/20260701_merged_run/merged_complete86.split.jsonl
  concurrency: 8
network:
  all_proxy: ${ALL_PROXY}
  no_proxy: ${NO_PROXY}
  default_no_proxy:
  - localhost
  - 127.0.0.1
  - 0.0.0.0
models:
  default:
    model: openai/gpt-5.5
    base_url: ${OPENAI_BASE_URL}
    api_key_env: OPENAI_API_KEY
    temperature: 0.2
    max_tokens: 32768
    top_p: 1.0
    timeout_seconds: 180
    max_retries: 3
  profiles:
    gpt-5.5:
      summary:
        model: openai/gpt-5.5
      agent:
        model: openai/gpt-5.5
      answer:
        model: openai/gpt-5.5
      final_review:
        model: openai/gpt-5.5
        timeout_seconds: 600
      vlm:
        model: openai/gpt-5.5
    deepseek_v4_pro:
      agent:
        model: deepseek/deepseek-v4-pro
      final_review:
        model: deepseek/deepseek-v4-pro
        timeout_seconds: 600
    gemini_3_1_pro:
      final_review:
        model: google/gemini-3.1-pro-preview
        timeout_seconds: 600
    claude_opus_4_8:
      final_review:
        model: anthropic/claude-opus-4.8
        temperature: null
        top_p: null
        timeout_seconds: 600
    glm_5_2:
      final_review:
        model: z-ai/glm-5.2
        timeout_seconds: 600
    kimi_k2.6:
      agent:
        model: moonshotai/kimi-k2.6
      final_review:
        model: moonshotai/kimi-k2.6
    kimi_k2_7_code:
      final_review:
        model: moonshotai/kimi-k2.7-code
        temperature: 1
        top_p: 0.95
        timeout_seconds: 600
    claude_code:
      default:
        provider: claude_code
        model: opus
        timeout_seconds: 600
      summary:
        model: sonnet
      answer:
        model: sonnet
      vlm:
        model: sonnet
      reranker:
        model: haiku
      citation:
        model: haiku
    claude_code_fable:
      default:
        provider: claude_code
        model: opus
        timeout_seconds: 600
      agent:
        model: claude-fable-5
      summary:
        model: sonnet
      answer:
        model: sonnet
      vlm:
        model: sonnet
      reranker:
        model: haiku
      citation:
        model: haiku
      final_review:
        model: claude-fable-5
  summary:
    temperature: 0.2
  agent:
    temperature: 0.3
  answer:
    temperature: 0.2
  final_review:
    temperature: 0.2
  vlm:
    temperature: 0.1
  reranker:
    temperature: 0
    max_tokens: 1024
    timeout_seconds: 30
    max_retries: 2
agents:
  summary:
    model: summary
  contribution:
    model: agent
    answer_model: answer
    min_qa_turns: 4
    max_qa_turns: 6
    require_balanced_qa: false
  soundness:
    model: agent
    answer_model: answer
    min_qa_turns: 4
    max_qa_turns: 7
    require_balanced_qa: false
  presentation:
    model: agent
    answer_model: answer
    vlm_model: vlm
    min_qa_turns: 4
    max_qa_turns: 5
    require_balanced_qa: false
    use_vlm: true
    require_pdf: true
  final:
    model: final_review
retrieval:
  enabled: true
  semantic_scholar:
    api_key_env: SEMANTIC_SCHOLAR_API_KEY
    endpoint: https://api.semanticscholar.org/graph/v1/paper/search
    timeout_seconds: 30
  search:
    limit_per_query: 20
    fields:
    - title
    - abstract
    - year
    - authors
    - venue
    - citationCount
    - publicationDate
    - externalIds
    - url
  time_filter:
    enabled: true
  rerank:
    enabled: true
    model: reranker
    top_k: 8
    min_candidates: 15
qa:
  max_answer_steps: 8
  max_format_retries: 3
compliance:
  enabled: true
  check_citations: true
  check_page_limit: true
  extract_model: citation
  max_refs_checked: 60
  request_delay_seconds: 1.0
  hard_gate_min_nonexistent: 3
  max_section_chars: 40000
  page_limit_buffer: 1
  page_limits:
    ICLR: 10
xml:
  max_generation_attempts: 5
paper:
  max_text_chars: 120000
  max_pdf_read_pages: 3
  page_image_dpi: 220
logging:
  level: INFO
  log_file: outputs/logs/reviewer.log
