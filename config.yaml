# Purpose: Single source of configuration for models, agents, retrieval, XML,
# paper loading, logging, and outputs.

project:
  output_dir: outputs

bench:
  root: ../DeepReview-Bench
  output_dir: outputs/deepreview_bench
  splits:
    dev: ../DeepReview-Bench/splits/deepreview13k_test_dev.jsonl
    lite: ../DeepReview-Bench/splits/deepreview13k_test_lite.jsonl
    test: ../DeepReview-Bench/splits/deepreview13k_test.jsonl
    all: ../DeepReview-Bench/splits/all.jsonl
  concurrency: 8

network:
  all_proxy: ${ALL_PROXY}
  no_proxy: ${NO_PROXY}
  default_no_proxy:
    - localhost
    - 127.0.0.1
    - 0.0.0.0

models:
  default:
    model: openai/gpt-5.5
    base_url: ${OPENAI_BASE_URL}
    api_key_env: OPENAI_API_KEY
    temperature: 0.2
    max_tokens: 32768
    top_p: 1.0
    timeout_seconds: 60
    max_retries: 3

  profiles:
    deepseek_v4_pro:
      final_review:
        model: deepseek-v4-pro

  summary:
    temperature: 0.2

  agent:
    temperature: 0.3

  answer:
    temperature: 0.2

  final_review:
    temperature: 0.2

  vlm:
    temperature: 0.1

  reranker:
    temperature: 0
    max_tokens: 1024
    timeout_seconds: 30
    max_retries: 2

agents:
  summary:
    model: summary

  contribution:
    model: agent
    answer_model: answer
    min_qa_turns: 3
    max_qa_turns: 10
    require_balanced_qa: true

  soundness:
    model: agent
    answer_model: answer
    min_qa_turns: 4
    max_qa_turns: 10
    require_balanced_qa: true

  presentation:
    model: agent
    answer_model: answer
    vlm_model: vlm
    min_qa_turns: 2
    max_qa_turns: 10
    require_balanced_qa: true
    use_vlm: true
    require_vlm: false
    require_pdf: true

  final:
    model: final_review

retrieval:
  enabled: true
  semantic_scholar:
    api_key_env: SEMANTIC_SCHOLAR_API_KEY
    endpoint: https://api.semanticscholar.org/graph/v1/paper/search
    timeout_seconds: 30
  search:
    limit_per_query: 20
    fields:
      - title
      - abstract
      - year
      - authors
      - venue
      - citationCount
      - publicationDate
      - externalIds
      - url
  time_filter:
    enabled: true
  rerank:
    enabled: true
    model: reranker
    top_k: 8
    min_candidates: 15

qa:
  max_answer_steps: 6

paper:
  max_text_chars: 120000
  max_pdf_read_pages: 3
  presentation_pdf_pages: 3
  max_vlm_pages: 8
  page_image_dpi: 160

logging:
  level: INFO
  log_file: outputs/logs/reviewer.log
