# Purpose: Single source of configuration for models, agents, retrieval, XML,
# paper loading, logging, and outputs.

project:
  output_dir: outputs

review:
  rubric_profile: ICLR

bench:
  root: /home/ubuntu/DeepReview-Bench
  output_dir: outputs/deepreview_bench
  splits:
    dev: /home/ubuntu/DeepReview-Bench/splits/deepreview13k_test_dev_clean100.jsonl
    lite: /home/ubuntu/DeepReview-Bench/splits/deepreview13k_test_lite.jsonl
    test: /home/ubuntu/DeepReview-Bench/splits/deepreview13k_test.jsonl
    all: /home/ubuntu/DeepReview-Bench/splits/all.jsonl
  concurrency: 8

network:
  all_proxy: ${ALL_PROXY}
  no_proxy: ${NO_PROXY}
  default_no_proxy:
    - localhost
    - 127.0.0.1
    - 0.0.0.0

models:
  default:
    model: openai/gpt-5.5
    base_url: ${OPENAI_BASE_URL}
    api_key_env: OPENAI_API_KEY
    temperature: 0.2
    max_tokens: 32768
    top_p: 1.0
    timeout_seconds: 180
    max_retries: 3

  profiles:
    gpt-5.5:
      summary:
        model: openai/gpt-5.5
      agent:
        model: openai/gpt-5.5
      answer:
        model: openai/gpt-5.5
      final_review:
        model: openai/gpt-5.5
      vlm:
        model: openai/gpt-5.5

    deepseek_v4_pro:
      agent:
        model: deepseek/deepseek-v4-pro
      final_review:
        model: deepseek/deepseek-v4-pro

    kimi_k2.6:
      agent:
        model: moonshotai/kimi-k2.6
      final_review:
        model: moonshotai/kimi-k2.6

    # Run every model through the local Claude Code CLI (uses your logged-in
    # Claude subscription instead of a per-token API key). Activate with:
    #   model_profile: claude_code   (or models.active_profile / --model-profile)
    # `model` values are CLI --model arguments (aliases like opus/sonnet/haiku
    # or full ids like claude-opus-4-8). base_url/api_key_env/temperature are
    # ignored on this path; Claude runs no built-in tools (see docs).
    claude_code:
      default:
        provider: claude_code
        model: opus          # opus 仅用于判断/方向：维度提问(agent)+ final 综合
        timeout_seconds: 600 # CLI 在并发+订阅限流下会排队，180s 太短会超时丢篇
      summary:
        model: sonnet
      answer:
        model: sonnet        # ~81% 的调用；取证/工具编排偏执行 → sonnet 足够，最大省钱杠杆
      vlm:
        model: sonnet        # 视觉检查，调用量小，sonnet 视觉够用
      reranker:
        model: haiku         # 纯相关性排序 + JSON 输出，haiku 足够，最便宜
      citation:
        model: haiku         # 参考文献文本 → 结构化 JSON，纯机械抽取，haiku 足够

  summary:
    temperature: 0.2

  agent:
    temperature: 0.3

  answer:
    temperature: 0.2

  final_review:
    temperature: 0.2

  vlm:
    temperature: 0.1

  reranker:
    temperature: 0
    max_tokens: 1024
    timeout_seconds: 30
    max_retries: 2

agents:
  summary:
    model: summary

  contribution:
    model: agent
    answer_model: answer
    min_qa_turns: 4
    max_qa_turns: 6
    require_balanced_qa: false

  soundness:
    model: agent
    answer_model: answer
    min_qa_turns: 4
    max_qa_turns: 7
    require_balanced_qa: false

  presentation:
    model: agent
    answer_model: answer
    vlm_model: vlm
    min_qa_turns: 4
    max_qa_turns: 5
    require_balanced_qa: false
    use_vlm: true
    require_pdf: true

  final:
    model: final_review

retrieval:
  enabled: true
  semantic_scholar:
    api_key_env: SEMANTIC_SCHOLAR_API_KEY
    endpoint: https://api.semanticscholar.org/graph/v1/paper/search
    timeout_seconds: 30
  search:
    limit_per_query: 20
    fields:
      - title
      - abstract
      - year
      - authors
      - venue
      - citationCount
      - publicationDate
      - externalIds
      - url
  time_filter:
    enabled: true
  rerank:
    enabled: true
    model: reranker
    top_k: 8
    min_candidates: 15

qa:
  max_answer_steps: 8
  max_format_retries: 3

# Compliance checks folded into the Presentation dimension as preloaded
# evidence. Hard, reject-worthy violations arrive tagged impact_level=C0
# (must-reject hard gate); conservative by design so a single ambiguous
# detection only flags a soft concern, never an automatic reject.
compliance:
  enabled: true
  check_citations: true
  check_page_limit: true
  extract_model: citation         # dedicated key: haiku under claude_code, inherits default elsewhere
  max_refs_checked: 60            # cap API calls per paper
  request_delay_seconds: 1.0      # pace requests to avoid Semantic Scholar 429s
  hard_gate_min_nonexistent: 3  # confirmed fabricated refs before it is a C0 hard gate
  max_section_chars: 40000
  page_limit_buffer: 1            # grace pages over the limit before flagging (boundary noise)
  page_limits:                    # main-text page limit per venue (PDF inputs only)
    ICLR: 10

xml:
  max_generation_attempts: 5

paper:
  max_text_chars: 120000
  max_pdf_read_pages: 3
  page_image_dpi: 220

logging:
  level: INFO
  log_file: outputs/logs/reviewer.log
